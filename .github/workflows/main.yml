name: APK derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Hazirlik (dosyalar ve modeller)
        run: bash hazirla.sh

      - name: APK derle
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk RusTurkTercuman.apk
          ls -la RusTurkTercuman.apk

      - name: Indirme sayfasina koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete son-surum -y --cleanup-tag || true
          gh release create son-surum RusTurkTercuman.apk --title "Tercuman APK" --notes "RusTurkTercuman.apk dosyasina dokunup indirin."

name: APK derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Dosyalari yerlestir
        run: |
          mkdir -p app/src/main/java/com/ceviri/rustr app/src/main/res/layout app/src/main/res/values
          mv app.gradle.kts app/build.gradle.kts
          mv AndroidManifest.xml app/src/main/
          mv MainActivity.kt app/src/main/java/com/ceviri/rustr/
          mv activity_main.xml app/src/main/res/layout/
          mv strings.xml themes.xml app/src/main/res/values/

      - name: APK derle
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk RusTurkTercuman.apk

      - name: Indirme sayfasina koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete son-surum -y --cleanup-tag || true
          gh release create son-surum RusTurkTercuman.apk --title "Tercuman APK" --notes "RusTurkTercuman.apk dosyasina dokunup indirin."

name: APK derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Dosyalari yerlestir
        run: |
          mkdir -p app/src/main/java/com/ceviri/rustr app/src/main/res/layout app/src/main/res/values app/src/main/assets/asr app/libs
          mv app.gradle.kts app/build.gradle.kts
          mv imza.jks app/
          mv AndroidManifest.xml app/src/main/
          mv *.kt app/src/main/java/com/ceviri/rustr/
          mv activity_main.xml app/src/main/res/layout/
          mv strings.xml themes.xml app/src/main/res/values/

      - name: Ses modellerini indir
        run: |
          B=https://github.com/k2-fsa/sherpa-onnx/releases/download
          curl -fsSL -o app/libs/sherpa-onnx.aar $B/v2.0.3/sherpa-onnx-2.0.3.aar
          M=sherpa-onnx-streaming-zipformer-small-ru-vosk-int8-2025-08-16
          curl -fsSL $B/asr-models/$M.tar.bz2 | tar xj
          cp $M/encoder.int8.onnx $M/decoder.onnx $M/joiner.int8.onnx $M/tokens.txt app/src/main/assets/asr/
          rm -rf $M
          curl -fsSL -o app/src/main/assets/spk.onnx $B/speaker-recongition-models/nemo_en_titanet_small.onnx
          ls -la app/libs app/src/main/assets app/src/main/assets/asr

      - name: APK derle
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk RusTurkTercuman.apk
          ls -la RusTurkTercuman.apk

      - name: Indirme sayfasina koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete son-surum -y --cleanup-tag || true
          gh release create son-surum RusTurkTercuman.apk --title "Tercuman APK" --notes "RusTurkTercuman.apk dosyasina dokunup indirin."
